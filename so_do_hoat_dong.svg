<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1320" viewBox="0 0 1000 1320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .start   { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .title   { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub     { font-size: 14px; fill: #475569; }
      .step    { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .desc    { font-size: 12.5px; fill: #334155; }
      .code    { font-size: 11.5px; fill: #1d4ed8; font-family: Consolas, monospace; }
      .flow    { stroke: #334155; stroke-width: 2; fill: none; }
      .flowlbl { font-size: 11.5px; fill: #64748b; }
      .phaselbl{ font-size: 12px; font-weight:700; fill:#fff; }
    </style>
  </defs>

  <rect width="1000" height="1320" fill="#f8fafc"/>
  <text x="500" y="46" text-anchor="middle" class="title">Sentinel - So do hoat dong mot lan quet</text>
  <text x="500" y="70" text-anchor="middle" class="sub">Kiem thu xam nhap web hop den co AI Agent  -  AI lap ke hoach, Oracle ket luan theo bang chung</text>

  <!-- START -->
  <rect x="380" y="95" width="240" height="46" rx="23" fill="#0f172a"/>
  <text x="500" y="124" text-anchor="middle" class="start">Nguoi dung bam START</text>

  <!-- create_scan -->
  <rect x="330" y="170" width="340" height="60" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="500" y="195" text-anchor="middle" class="step">Tiep nhan yeu cau: create_scan()</text>
  <text x="500" y="218" text-anchor="middle" class="code">app/main.py : 237</text>

  <!-- Scope guard (decision) -->
  <polygon points="500,255 690,320 500,385 310,320" fill="#fee2e2" stroke="#ef4444"/>
  <text x="500" y="308" text-anchor="middle" class="step">SCOPE GUARD</text>
  <text x="500" y="328" text-anchor="middle" class="desc">host nam trong lab cho phep?</text>
  <text x="500" y="346" text-anchor="middle" class="code">scope.py : 11 / 18 / 28</text>
  <!-- reject branch -->
  <rect x="740" y="290" width="230" height="60" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="855" y="315" text-anchor="middle" class="step" fill="#b91c1c">TU CHOI (ScopeError)</text>
  <text x="855" y="337" text-anchor="middle" class="desc">host la -> dung, khong quet</text>
  <path class="flow" d="M690,320 L740,320" marker-end="url(#arrow)"/>
  <text x="715" y="312" text-anchor="middle" class="flowlbl">khong</text>

  <!-- PentestAgent.run + mode branch -->
  <rect x="300" y="415" width="400" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="500" y="440" text-anchor="middle" class="step">PentestAgent.run()  -  chon che do</text>
  <text x="500" y="461" text-anchor="middle" class="desc">co key DeepSeek + auto/function_calling -> Function-calling</text>
  <text x="500" y="479" text-anchor="middle" class="desc">nguoc lai -> Pipeline co dinh (cung buoc verify/detector)</text>
  <text x="500" y="496" text-anchor="middle" class="code">agent.py : 273 (281 / 305)</text>

  <!-- Phase band -->
  <rect x="40" y="525" width="170" height="640" rx="10" fill="#1e293b" opacity="0.06"/>
  <text x="125" y="548" text-anchor="middle" class="sub" font-weight="700">9 BUOC QUET</text>

  <!-- B1 -->
  <rect x="300" y="530" width="400" height="74" rx="10" fill="#ecfeff" stroke="#06b6d4"/>
  <rect x="240" y="548" width="52" height="38" rx="6" fill="#06b6d4"/>
  <text x="266" y="573" text-anchor="middle" class="phaselbl">B1</text>
  <text x="500" y="554" text-anchor="middle" class="step">Trinh sat &amp; THU THAP ENDPOINT</text>
  <text x="500" y="573" text-anchor="middle" class="desc">crawl form / duong dan / param; browser bat endpoint an</text>
  <text x="500" y="595" text-anchor="middle" class="code">tools.py:190 (goi tai agent.py:334) ; browser tools.py:327</text>

  <!-- B2 -->
  <rect x="300" y="618" width="400" height="58" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <rect x="240" y="628" width="52" height="38" rx="6" fill="#22c55e"/>
  <text x="266" y="653" text-anchor="middle" class="phaselbl">B2</text>
  <text x="500" y="643" text-anchor="middle" class="step">Nho phien truoc (Long-term memory)</text>
  <text x="500" y="664" text-anchor="middle" class="code">memory.py:81 (goi tai agent.py:337)</text>

  <!-- B3 -->
  <rect x="300" y="690" width="400" height="66" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <rect x="240" y="702" width="52" height="38" rx="6" fill="#eab308"/>
  <text x="266" y="727" text-anchor="middle" class="phaselbl">B3</text>
  <text x="500" y="714" text-anchor="middle" class="step">Lap ke hoach (AI - DeepSeek)</text>
  <text x="500" y="733" text-anchor="middle" class="desc">AI chon cac kich ban can thu (co nhanh du phong)</text>
  <text x="500" y="751" text-anchor="middle" class="code">PlanningAgent agent.py:71 (goi tai agent.py:339)</text>

  <!-- B4-B7 loop box -->
  <rect x="265" y="770" width="470" height="196" rx="12" fill="#fff7ed" stroke="#f97316" stroke-dasharray="6 4"/>
  <rect x="240" y="782" width="86" height="38" rx="6" fill="#f97316"/>
  <text x="283" y="807" text-anchor="middle" class="phaselbl">B4-B7</text>
  <text x="500" y="792" text-anchor="middle" class="step">Vong lap theo tung kich ban (for kind in plan - agent.py:351)</text>

  <rect x="285" y="806" width="200" height="50" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="385" y="827" text-anchor="middle" class="step">B4 Tan cong</text>
  <text x="385" y="846" text-anchor="middle" class="code">AttackAgent agent.py:353</text>

  <rect x="515" y="806" width="200" height="50" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="615" y="821" text-anchor="middle" class="step">B5 Xac minh - ORACLE</text>
  <text x="615" y="838" text-anchor="middle" class="desc">co bang chung moi ket luan</text>
  <text x="615" y="852" text-anchor="middle" class="code">agent.py:355 / :196</text>

  <rect x="285" y="870" width="200" height="50" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="385" y="891" text-anchor="middle" class="step">B6 Oracle lab</text>
  <text x="385" y="910" text-anchor="middle" class="code">check_lab labs.py:14 (:356)</text>

  <rect x="515" y="870" width="200" height="50" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="615" y="891" text-anchor="middle" class="step">B7 ReAct tinh chinh</text>
  <text x="615" y="910" text-anchor="middle" class="code">refine agent.py:357 / :359</text>

  <text x="500" y="945" text-anchor="middle" class="flowlbl">lap lai cho moi kich ban trong ke hoach</text>

  <!-- arrows inside loop -->
  <path class="flow" d="M485,831 L515,831" marker-end="url(#arrow)"/>
  <path class="flow" d="M615,856 L615,870" marker-end="url(#arrow)"/>
  <path class="flow" d="M515,895 L485,895" marker-end="url(#arrow)"/>

  <!-- B8 -->
  <rect x="300" y="980" width="400" height="74" rx="10" fill="#faf5ff" stroke="#a855f7"/>
  <rect x="240" y="998" width="52" height="38" rx="6" fill="#a855f7"/>
  <text x="266" y="1023" text-anchor="middle" class="phaselbl">B8</text>
  <text x="500" y="1004" text-anchor="middle" class="step">Bo detector tong quat (moi moi truong)</text>
  <text x="500" y="1023" text-anchor="middle" class="desc">run_all chay moi @register trong app/scenarios/tnX_*.py</text>
  <text x="500" y="1045" text-anchor="middle" class="code">detectors.py:46 (goi tai agent.py:369)</text>

  <!-- B9 -->
  <rect x="300" y="1068" width="400" height="74" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <rect x="240" y="1086" width="52" height="38" rx="6" fill="#6366f1"/>
  <text x="266" y="1111" text-anchor="middle" class="phaselbl">B9</text>
  <text x="500" y="1092" text-anchor="middle" class="step">Gop trung + Bao cao + Luu phien</text>
  <text x="500" y="1111" text-anchor="middle" class="desc">dedupe -> ReportingAgent -> remember</text>
  <text x="500" y="1133" text-anchor="middle" class="code">agent.py:374-378</text>

  <!-- OUTPUT -->
  <rect x="330" y="1165" width="340" height="60" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="1190" text-anchor="middle" class="step">BAO CAO TIENG VIET (xem/in PDF)</text>
  <text x="500" y="1212" text-anchor="middle" class="code">report_vi.py:94  (main.py:118)</text>

  <text x="500" y="1258" text-anchor="middle" class="sub">Toan bo mach dieu phoi o app/agent.py  -  ban do tung buoc: comment agent.py dong 306-332</text>
  <text x="500" y="1282" text-anchor="middle" class="sub" font-weight="700" fill="#b91c1c">Nguyen tac: AI chi CHON thu gi; ORACLE moi KET LUAN co lo hong dua tren bang chung</text>

  <!-- MAIN FLOW ARROWS -->
  <path class="flow" d="M500,141 L500,170" marker-end="url(#arrow)"/>
  <path class="flow" d="M500,230 L500,255" marker-end="url(#arrow)"/>
  <path class="flow" d="M500,385 L500,415" marker-end="url(#arrow)"/>
  <text x="520" y="403" class="flowlbl">hop le</text>
  <path class="flow" d="M500,501 L500,530" marker-end="url(#arrow)"/>
  <path class="flow" d="M500,604 L500,618" marker-end="url(#arrow)"/>
  <path class="flow" d="M500,676 L500,690" marker-end="url(#arrow)"/>
  <path class="flow" d="M500,756 L500,770" marker-end="url(#arrow)"/>
  <path class="flow" d="M500,966 L500,980" marker-end="url(#arrow)"/>
  <path class="flow" d="M500,1054 L500,1068" marker-end="url(#arrow)"/>
  <path class="flow" d="M500,1142 L500,1165" marker-end="url(#arrow)"/>
</svg>

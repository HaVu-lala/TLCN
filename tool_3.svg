<svg xmlns="http://www.w3.org/2000/svg" width="860" height="610" viewBox="0 0 860 610" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker></defs><rect width="860" height="610" fill="#ffffff"/><rect x="50" y="24" width="760" height="60" rx="10" fill="#e08a3c"/><text x="430" y="62" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Tool 3 - Probe &amp; Verify (kiểm thử chủ động + xác minh)</text><text x="90" y="100" font-size="12" font-weight="700" fill="#6d28d9">ĐẦU VÀO (AI gọi)</text><rect x="80" y="108" width="700" height="78" rx="9" fill="#ede9fe" stroke="#9b72c9" stroke-width="1.6"/><text x="102" y="136" font-size="14.5" font-weight="700" fill="#1f2937">AI gọi: probe_and_verify(url, parameter, payload, kind)</text><text x="102" y="156" font-size="12.5" fill="#374151">kind ∈ SQLi / Reflected-XSS / Stored-XSS / IDOR</text><text x="102" y="174" font-size="11.5" fill="#1d4ed8" font-family="Consolas,monospace">toolbox.py:145</text><path d="M430,186 L430,212" stroke="#475569" stroke-width="1.9" fill="none" marker-end="url(#a)"/><rect x="80" y="212" width="700" height="60" rx="9" fill="#f8fafc" stroke="#e08a3c" stroke-width="1.6"/><text x="102" y="240" font-size="14.5" font-weight="700" fill="#1f2937">Tìm ngữ cảnh input (form hay JSON API) để gửi request đúng thật</text><text x="102" y="260" font-size="11.5" fill="#1d4ed8" font-family="Consolas,monospace">toolbox.py:96</text><path d="M430,272 L430,298" stroke="#475569" stroke-width="1.9" fill="none" marker-end="url(#a)"/><rect x="80" y="298" width="700" height="44" rx="9" fill="#f8fafc" stroke="#e08a3c" stroke-width="1.6"/><text x="102" y="325.0" font-size="14.5" font-weight="700" fill="#1f2937">Gửi BASELINE (giá trị lành) + gửi PAYLOAD; IDOR dùng 2 phiên so sánh</text><path d="M430,342 L430,368" stroke="#475569" stroke-width="1.9" fill="none" marker-end="url(#a)"/><rect x="80" y="368" width="700" height="60" rx="9" fill="#f8fafc" stroke="#e08a3c" stroke-width="1.6"/><text x="102" y="396" font-size="14.5" font-weight="700" fill="#1f2937">Dựng AttackProbe rồi gọi ORACLE: VerificationAgent.run()</text><text x="102" y="416" font-size="11.5" fill="#1d4ed8" font-family="Consolas,monospace">agent.py:196</text><path d="M430,428 L430,454" stroke="#475569" stroke-width="1.9" fill="none" marker-end="url(#a)"/><text x="90" y="446" font-size="12" font-weight="700" fill="#e08a3c">ĐẦU RA (trả về AI)</text><rect x="80" y="454" width="700" height="66" rx="9" fill="#fdeedd" stroke="#e08a3c" stroke-width="1.6"/><text x="102" y="482" font-size="14.5" font-weight="700" fill="#1f2937">Trả { confirmed: true/false, finding }</text><text x="102" y="502" font-size="12.5" fill="#374151">ORACLE quyết định - không phải AI</text><rect x="590" y="534" width="190" height="30" rx="15" fill="#b91c1c"/><text x="685" y="554" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">KẾT LUẬN do ORACLE</text></svg>
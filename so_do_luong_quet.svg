<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="720" viewBox="0 0 1020 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .h    { font-size: 19px; font-weight: 700; fill: #1e3a5f; }
      .b    { font-size: 14px; font-weight: 700; fill: #1f2937; }
      .s    { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; }
    </style>
  </defs>
  <rect width="1020" height="720" fill="#ffffff"/>

  <!-- divider -->
  <line x1="510" y1="40" x2="510" y2="690" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- ===================== FUNCTION-CALLING (trai) ===================== -->
  <text x="250" y="38" text-anchor="middle" class="h">Chế độ Function-calling (AI điều phối)</text>

  <rect x="100" y="70" width="300" height="46" rx="23" fill="#0f172a"/>
  <text x="250" y="98" text-anchor="middle" class="s">Người dùng bấm START</text>

  <rect x="100" y="150" width="300" height="46" rx="8" fill="#fde8e8" stroke="#e05858" stroke-width="1.5"/>
  <text x="250" y="178" text-anchor="middle" class="b">Scope Guard (chặn ngoài phạm vi)</text>

  <rect x="100" y="230" width="300" height="46" rx="8" fill="#e8dff5" stroke="#9b72c9" stroke-width="1.5"/>
  <text x="250" y="258" text-anchor="middle" class="b">AI tự điều phối (ReAct)</text>

  <!-- LLM box beside -->
  <rect x="420" y="230" width="150" height="46" rx="8" fill="#e8dff5" stroke="#9b72c9" stroke-width="1.5"/>
  <text x="495" y="251" text-anchor="middle" class="b">LLM DeepSeek</text>
  <text x="495" y="268" text-anchor="middle" class="b" font-weight="400" font-size="12">suy luận, gọi tool</text>
  <path class="edge" d="M400,246 L420,246" marker-end="url(#a)"/>
  <path class="edge" d="M420,260 L400,260" marker-end="url(#a)"/>

  <rect x="100" y="310" width="300" height="46" rx="8" fill="#d7ead9" stroke="#6aab6e" stroke-width="1.5"/>
  <text x="250" y="338" text-anchor="middle" class="b">AI tự chọn &amp; gọi tool tấn công</text>

  <rect x="100" y="390" width="300" height="46" rx="8" fill="#fde5cf" stroke="#e08a3c" stroke-width="1.5"/>
  <text x="250" y="418" text-anchor="middle" class="b">Oracle xác thực (kết luận)</text>

  <rect x="100" y="470" width="300" height="46" rx="8" fill="#d6e4f2" stroke="#5b8fc9" stroke-width="1.5"/>
  <text x="250" y="498" text-anchor="middle" class="b">Báo cáo tiếng Việt</text>

  <path class="edge" d="M250,116 L250,150" marker-end="url(#a)"/>
  <path class="edge" d="M250,196 L250,230" marker-end="url(#a)"/>
  <path class="edge" d="M250,276 L250,310" marker-end="url(#a)"/>
  <path class="edge" d="M250,356 L250,390" marker-end="url(#a)"/>
  <path class="edge" d="M250,436 L250,470" marker-end="url(#a)"/>

  <!-- ===================== PIPELINE (phai) ===================== -->
  <text x="770" y="38" text-anchor="middle" class="h">Chế độ Pipeline (tất định, dự phòng)</text>

  <rect x="620" y="70" width="300" height="42" rx="21" fill="#0f172a"/>
  <text x="770" y="96" text-anchor="middle" class="s">Người dùng bấm START</text>

  <rect x="620" y="140" width="300" height="42" rx="8" fill="#fde8e8" stroke="#e05858" stroke-width="1.5"/>
  <text x="770" y="166" text-anchor="middle" class="b">Scope Guard (chặn ngoài phạm vi)</text>

  <rect x="620" y="210" width="300" height="42" rx="8" fill="#d7ead9" stroke="#6aab6e" stroke-width="1.5"/>
  <text x="770" y="236" text-anchor="middle" class="b">Recon (thu thập endpoint)</text>

  <rect x="620" y="280" width="300" height="42" rx="8" fill="#e8dff5" stroke="#9b72c9" stroke-width="1.5"/>
  <text x="770" y="306" text-anchor="middle" class="b">Planning (AI chọn kịch bản)</text>

  <rect x="620" y="350" width="300" height="42" rx="8" fill="#d7ead9" stroke="#6aab6e" stroke-width="1.5"/>
  <text x="770" y="376" text-anchor="middle" class="b">Attack (tấn công)</text>

  <rect x="620" y="420" width="300" height="42" rx="8" fill="#fde5cf" stroke="#e08a3c" stroke-width="1.5"/>
  <text x="770" y="446" text-anchor="middle" class="b">Verification - Oracle (kết luận)</text>

  <rect x="620" y="490" width="300" height="42" rx="8" fill="#d7ead9" stroke="#6aab6e" stroke-width="1.5"/>
  <text x="770" y="516" text-anchor="middle" class="b">Detectors theo kịch bản</text>

  <rect x="620" y="560" width="300" height="42" rx="8" fill="#d6e4f2" stroke="#5b8fc9" stroke-width="1.5"/>
  <text x="770" y="586" text-anchor="middle" class="b">Báo cáo tiếng Việt</text>

  <path class="edge" d="M770,112 L770,140" marker-end="url(#a)"/>
  <path class="edge" d="M770,182 L770,210" marker-end="url(#a)"/>
  <path class="edge" d="M770,252 L770,280" marker-end="url(#a)"/>
  <path class="edge" d="M770,322 L770,350" marker-end="url(#a)"/>
  <path class="edge" d="M770,392 L770,420" marker-end="url(#a)"/>
  <path class="edge" d="M770,462 L770,490" marker-end="url(#a)"/>
  <path class="edge" d="M770,532 L770,560" marker-end="url(#a)"/>

  <!-- footer note -->
  <text x="510" y="675" text-anchor="middle" font-size="13" fill="#64748b">Hai chế độ dùng chung Oracle kết luận: AI chỉ CHỌN thử gì, Oracle mới KẾT LUẬN theo bằng chứng.</text>
</svg>
